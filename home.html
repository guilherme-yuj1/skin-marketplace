<!doctype html>

<body>
  <main>

    <header>

      <h2>Counter Strike</h2>
      <div class="loja">

        <div class="skin">

        <div class="skin">

      </div>
    </section>

    <section class="game" id="r6">
      <h2>Rainbow Six Siege</h2>
      <div class="loja">
        <div class="skin">
            <img src="./assets/img/416c-blackice.png" alt="Black Ice">
            <p class="nome">416-C Black Ice</p>
            <p class="preco">R$329,99</p>
        </div>
        
        <div class="skin">
          <img src="./assets/img/glacier.png" alt="Glacier">
          <p class="nome">416-C Glacier</p>
          <p class="preco">R$1.499,99</p>
        </div>
        
        <div class="skin">
          <img src="./assets/img/obsidian.png" alt="Obsidian">
          <p class="nome">R4-C Obsidian</p>

        <div class="skin">
          <img src="./assets/img/SASG-12-golddust.png" alt="Gold Dust">
          <p class="nome">SASG-12 Gold Dust</p>
          <p class="preco">R$39,99</p>
        </div>
        
        <div class="skin">
          <img src="./assets/img/416c-bluenebula.png" alt="Blue Nebula">
          <p class="nome">416-C Blue Nebula</p>
          <p class="preco">R$359,99</p>
        </div>
      </div>

    <footer>
      <h2>Footer</h2>
